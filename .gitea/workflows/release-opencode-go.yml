name: Release opencode-go

# Gitea reads workflows only from <repo>/.gitea/workflows/, so the plugin
# release pipeline lives at the repository root even though the plugin sources
# are in opencode-go/. Tag v<version> publishes the matching VERSION build.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build, publish, and update registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: opencode-go/go.mod

      - name: Run plugin tests
        working-directory: opencode-go
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run store tests
        run: |
          set -euo pipefail
          python3 scripts/validate-registry.py registry.json
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build and package archives
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < opencode-go/VERSION)"
          TAG="$(git describe --tags --exact-match)"
          test "$TAG" = "v$VERSION"

          # cgo cross builds need a target C compiler; macOS needs a macOS host.
          apt-get update
          apt-get install --yes gcc-aarch64-linux-gnu

          export OUT_DIR="${RUNNER_TEMP:-/tmp}/dist"
          rm -rf "$OUT_DIR"

          GOOS=linux GOARCH=amd64 CC=gcc bash opencode-go/scripts/build-archives.sh
          GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            bash opencode-go/scripts/build-archives.sh

          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish release assets
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/publish-release.py \
            --api-url "${GITHUB_SERVER_URL}" \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --plugin-id opencode-go \
            --version "${VERSION}" \
            --asset "$OUT_DIR/opencode-go_${VERSION}_linux_amd64.zip" \
            --asset "$OUT_DIR/opencode-go_${VERSION}_linux_arm64.zip" \
            --registry registry.json \
            --replace

      - name: Commit the updated registry
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- registry.json; then
            echo "registry.json is already up to date"
            exit 0
          fi
          git config user.name "gitea-actions"
          git config user.email "gitea-actions@users.noreply.github.com"
          git add registry.json
          git commit -m "Update opencode-go registry to ${VERSION}"
          # Pushing the tag commit would move the immutable release, so commit to
          # the default branch instead. Requires an unprotected branch.
          git push origin "HEAD:${REGISTRY_BRANCH:-main}"
